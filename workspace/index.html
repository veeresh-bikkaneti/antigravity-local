<style>:root{--bg:white;--txt:black}html{transition:.2s}.d{filter:grayscale(100%)}.dark{--bg:#282c34;--txt:#abb2bf}.body{background:var(--bg);color:var(--txt)}</style><script>const toggleDark=document.querySelector.bind(document,'button');toggleDark().addEventListener('click',e=>document.body.classList.toggle('dark'))</script><body class=body><button onclick='document.body.classList.toggle("d")'>Toggle Dark Mode</button></body>
