name: docker
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  e2e-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: AGENTS.md rules (line caps, ASCII, referenced files exist)
        run: python scripts/check_agents_md.py
      - name: Docs checks (anchors, em dashes, emoji headings)
        run: python scripts/check_docs.py
      - name: Unit tests
        run: python -m unittest tests.test_memory_integrity tests.test_memory_determinism tests.test_serve tests.test_check_docs tests.test_launchers tests.test_repo_hygiene tests.test_task_report tests.test_site tests.test_agent_setup tests.test_no_frozen_defaults
      - name: Real E2E (docker path)
        run: python tests/e2e.py docker
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image (only after tests pass, never on PRs)
        if: github.event_name != 'pull_request'
        run: |
          IMG=ghcr.io/${GITHUB_REPOSITORY,,}
          docker build -t "$IMG:latest" -t "$IMG:${GITHUB_SHA::7}" .
          docker push --all-tags "$IMG"
