name: docker
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  e2e-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the commit-trailer check walks the PR's commits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No AI co-author trailers in this PR's commits (the local commit-msg hook can be skipped; this cannot)
        if: github.event_name == 'pull_request'
        run: python scripts/check_commit_trailers.py "origin/${{ github.base_ref }}..HEAD"
      - name: AGENTS.md rules (line caps, ASCII, referenced files exist)
        run: python scripts/check_agents_md.py
      - name: Docs checks (anchors, em dashes, emoji headings)
        run: python scripts/check_docs.py
      - name: Dev tools (arch guardrails)
        run: pip install -r requirements-dev.txt
      - name: Arch guardrails (report-only until a later phase)
        run: python scripts/check_arch.py --report-only
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Real E2E (docker path)
        run: python tests/e2e.py docker
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image (only after tests pass, never on PRs)
        if: github.event_name != 'pull_request'
        run: |
          IMG=ghcr.io/${GITHUB_REPOSITORY,,}
          docker build -t "$IMG:latest" -t "$IMG:${GITHUB_SHA::7}" .
          docker push --all-tags "$IMG"
